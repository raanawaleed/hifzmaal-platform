worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 8m; # headroom over the 5MB receipt upload limit

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # SPA fallback: unmatched routes go to the Vue app, not a 404 —
        # matches the catch-all route in routes/web.php.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Never serve dotfiles (.env, .git, etc.) even if something ends
        # up in public/ — belt-and-suspenders alongside .dockerignore.
        location ~ /\. {
            deny all;
        }
    }
}
